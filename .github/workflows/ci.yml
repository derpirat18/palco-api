name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: palco
          POSTGRES_PASSWORD: palco
          POSTGRES_DB: palco_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://palco:palco@localhost:5432/palco_test
      REDIS_URL: redis://localhost:6379/0
      REDIS_TEST_URL: redis://localhost:6379/15
      SECRET_KEY: llave_de_integracion_continua_no_sirve_en_produccion
      TICKET_SIGNING_KEY: firma_de_integracion_continua_no_sirve_en_prod
      ENTORNO: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Estilo
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Migraciones
        run: alembic upgrade head

      - name: Migraciones sin diferencias pendientes
        run: |
          alembic check || (echo "Hay cambios de modelo sin migracion" && exit 1)

      - name: Pruebas
        run: pytest -v
