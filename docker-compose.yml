# Lo comun a los contenedores de la imagen de Palco (perfil `imagen`).
x-palco: &palco
  profiles: ["imagen"]
  build: .
  image: palco-api:local
  # Sin esto, los trabajadores (PID 1) ignoran la senal de detenerse.
  init: true
  env_file: .env
  environment:
    # Dentro de Docker, los servicios se llaman por su nombre, no localhost.
    DATABASE_URL: postgresql://palco:palco@db:5432/palco_dev
    REDIS_URL: redis://redis:6379/0
    CORREO_SMTP_HOST: mailpit
    CORREO_SMTP_PUERTO: "1025"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: palco
      POSTGRES_PASSWORD: palco
      POSTGRES_DB: palco_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Se ejecuta solo la primera vez, con el volumen vacio.
      - ./scripts/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palco"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # appendonly para que un reinicio no borre los apartados en vuelo.
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Buzon de pruebas: atrapa todo correo que manda la app y lo muestra en
  # http://localhost:8025. Nada sale a internet.
  mailpit:
    image: axllent/mailpit:v1.20.5
    ports: ["1025:1025", "8025:8025"]

  # --- La imagen de produccion, corriendo en tu maquina (I1) ---------------
  # Solo con el perfil `imagen`:  .\make.ps1 imagen
  # (docker compose --profile imagen up --build -d). Es la misma imagen que
  # correra en AWS; aqui toma tu .env y apunta a los servicios de arriba.
  # La API queda en el puerto 8001 para no chocar con `.\make.ps1 correr`.
  migrar:
    <<: *palco
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  api:
    <<: *palco
    ports: ["8001:8000"]
    depends_on:
      migrar: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      retries: 3

  barrido:
    <<: *palco
    command: ["python", "-m", "app.workers.barrido"]
    depends_on:
      migrar: {condition: service_completed_successfully}

  bandeja:
    <<: *palco
    command: ["python", "-m", "app.workers.bandeja"]
    depends_on:
      migrar: {condition: service_completed_successfully}

volumes:
  pgdata:
  redisdata:
