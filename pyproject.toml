[project]
name = "palco-api"
version = "0.1.0"
description = "Plataforma de boletaje Palco"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "stripe>=16.0",
    "httpx>=0.28",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 88
target-version = "py312"
# Las migraciones son historia ya aplicada: se revisan al generarlas y no
# se vuelven a tocar. Reformatearlas solo mete ruido en el diff.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",  # Depends() en argumentos por defecto es idiomatico en FastAPI
    "N818",  # nombres de dominio en espanol, no sufijo "Error"
]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501", "N999"]
"tests/*" = ["S101"]

[tool.setuptools.packages.find]
include = ["app*"]
